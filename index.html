<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b0f">
  <meta name="description" content="原創哥德獵人風格三階段食物抽選 PWA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="獵人盛宴">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/gothic.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/animations.css">
  <title>Hunter's Feast｜獵人的盛宴</title>
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>

  <div class="scene" aria-hidden="true">
    <div class="moon-wrap">
      <div class="moon"></div>
      <div class="moon-haze"></div>
    </div>
    <div class="fog fog-a"></div>
    <div class="fog fog-b"></div>
    <div class="fog fog-c"></div>
  </div>

  <main class="app-shell">
    <section class="hero-panel">
      <div class="sigil" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="eyebrow">THE NIGHT CHOOSES</p>
      <h1>Hunter's Feast</h1>
      <p class="subtitle">獵人的盛宴</p>
      <div class="divider"></div>
      <p class="quote">「今晚，讓狩獵決定你的晚餐。」</p>

      <button id="huntButton" class="hunt-button" type="button">
        <span class="button-glow"></span>
        <span class="button-label">BEGIN HUNT</span>
        <span class="button-zh">開始狩獵</span>
      </button>

      <section id="resultPanel" class="result-panel" aria-live="polite">
        <p class="result-kicker">TONIGHT'S HUNT</p>
        <div class="result-grid">
          <article><span>第一階段・地區</span><strong id="regionResult">尚未抽選</strong></article>
          <article><span>第二階段・菜系</span><strong id="cuisineResult">尚未抽選</strong></article>
          <article class="final-dish"><span>第三階段・料理</span><strong id="dishResult">等待狩獵</strong></article>
        </div>
        <p id="resultQuote" class="result-quote">May good food guide your night.</p>
      </section>

      <button id="installButton" class="install-button" type="button" hidden>安裝到手機主畫面</button>
      <p class="install-note">iPhone：使用 Safari 開啟，點「分享」→「加入主畫面」。</p>
    </section>
  </main>

  <script src="./js/particles.js" defer></script>
  <script src="./js/ui.js" defer></script>
  <script src="./js/app.js" defer></script>
</body>
</html>
