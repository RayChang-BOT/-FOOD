<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<meta name="description" content="原創哥德獵人風格三階段食物轉盤 PWA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="獵人盛宴">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<link rel="icon" href="./assets/icons/icon-192.png">
<link rel="stylesheet" href="./css/reset.css">
<link rel="stylesheet" href="./css/variables.css">
<link rel="stylesheet" href="./css/gothic.css">
<link rel="stylesheet" href="./css/layout.css">
<link rel="stylesheet" href="./css/animations.css">
<title>Hunter's Feast｜獵人的盛宴</title>
</head>
<body>
<canvas id="particles" aria-hidden="true"></canvas>
<div class="scene" aria-hidden="true">
  <div class="moon-wrap"><div class="moon"></div><div class="moon-haze"></div></div>
  <div class="fog fog-a"></div><div class="fog fog-b"></div><div class="fog fog-c"></div>
</div>

<main class="app-shell">
<section class="hero-panel">
  <div class="sigil" aria-hidden="true"><span></span><span></span><span></span></div>
  <p class="eyebrow">THE NIGHT CHOOSES</p>
  <h1>Hunter's Feast</h1>
  <p class="subtitle">獵人的盛宴</p>
  <div class="divider"></div>
  <p class="quote">「今晚，讓狩獵決定你的晚餐。」</p>

  <section class="wheel-stage">
    <div class="wheel-pointer" aria-hidden="true"></div>
    <div id="wheel" class="wheel">
      <svg id="wheelSvg" viewBox="0 0 320 320" aria-label="食物轉盤"></svg>
      <div class="wheel-center">
        <span id="wheelStageLabel">準備狩獵</span>
        <strong id="wheelCurrentValue">等待開始</strong>
      </div>
    </div>
    <div class="stage-track">
      <div class="stage-item active" data-stage="0"><span>01</span><strong>地區</strong></div>
      <div class="stage-line"></div>
      <div class="stage-item" data-stage="1"><span>02</span><strong>菜系</strong></div>
      <div class="stage-line"></div>
      <div class="stage-item" data-stage="2"><span>03</span><strong>料理</strong></div>
    </div>
  </section>

  <button id="huntButton" class="hunt-button" type="button">
    <span class="button-glow"></span>
    <span class="button-label">BEGIN HUNT</span>
    <span class="button-zh">開始三階段狩獵</span>
  </button>

  <section id="resultPanel" class="result-panel" aria-live="polite">
    <p class="result-kicker">TONIGHT'S HUNT</p>
    <div class="result-grid">
      <article><span>地區</span><strong id="regionResult">尚未抽選</strong></article>
      <article><span>菜系</span><strong id="cuisineResult">尚未抽選</strong></article>
      <article class="final-dish"><span>料理</span><strong id="dishResult">等待狩獵</strong></article>
    </div>
    <div class="result-actions">
      <button id="favoriteButton" type="button">☆ 加入收藏</button>
      <button id="blockButton" type="button">⊘ 不再推薦</button>
    </div>
    <p id="resultQuote" class="result-quote">May good food guide your night.</p>
  </section>

  <section class="controls-panel">
    <label class="switch-row">
      <span>介面音效</span>
      <input id="soundToggle" type="checkbox" checked>
      <i></i>
    </label>
  </section>

  <section class="collection-grid">
    <article class="history-panel">
      <div class="history-header"><span>RECENT HUNTS</span><button id="clearHistoryButton">清除</button></div>
      <ol id="historyList" class="history-list"><li class="history-empty">尚無紀錄</li></ol>
    </article>
    <article class="history-panel">
      <div class="history-header"><span>FAVORITES</span><button id="clearFavoritesButton">清除</button></div>
      <ol id="favoritesList" class="history-list"><li class="history-empty">尚無收藏</li></ol>
    </article>
  </section>

  <button id="installButton" class="install-button" type="button" hidden>安裝到手機主畫面</button>
  <p class="install-note">iPhone：Safari → 分享 → 加入主畫面。</p>
</section>
</main>

<aside class="version-badge">Hunter's Feast · v0.4.0 · Round 4</aside>

<script src="./js/particles.js" defer></script>
<script src="./js/storage.js" defer></script>
<script src="./js/sound.js" defer></script>
<script src="./js/ui.js" defer></script>
<script src="./js/wheel.js" defer></script>
<script src="./js/app.js" defer></script>
</body>
</html>
